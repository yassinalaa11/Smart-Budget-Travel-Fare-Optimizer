name: SmartFare CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install asyncpg fastapi httpx joblib numpy pandas plotly pydantic-settings pytest pytest-asyncio ruff scikit-learn

      - name: Run Ruff linter
        run: ruff check api dashboard ingestion ml tests

      - name: Run pytest suite
        run: pytest -v

  dbt-parse:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smartfare
      POSTGRES_USER: smartfare
      POSTGRES_PASSWORD: ci_placeholder_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dbt-postgres
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core>=1.8,<1.12" "dbt-postgres>=1.8,<1.12"

      - name: Parse dbt project and validate DAG
        run: dbt parse --project-dir transform --profiles-dir transform
