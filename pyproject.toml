[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "smartfare"
version = "1.0.0"
description = "Travel price intelligence and recommendation platform"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "dbt-core>=1.8,<2",
  "dbt-postgres>=1.8,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "prefect>=2.20,<3",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "dashboard", "ingestion", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
