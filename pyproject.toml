[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "smartfare"
version = "0.1.0"
description = "Travel price intelligence and recommendation platform"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "dbt-core>=1.8,<2",
  "dbt-postgres>=1.8,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "prefect>=2.20,<3",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "dashboard", "ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"
