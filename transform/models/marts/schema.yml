version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: dim_route
    columns:
      - name: route_key
        tests:
          - not_null
          - unique
      - name: route_id
        tests:
          - not_null
          - unique

  - name: dim_hotel
    columns:
      - name: hotel_key
        tests:
          - not_null
          - unique

  - name: fct_flight_price_observations
    columns:
      - name: route_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_route')
              field: route_key
      - name: observed_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: departure_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: min_total_price
        tests:
          - not_null

  - name: fct_hotel_price_observations
    columns:
      - name: hotel_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_hotel')
              field: hotel_key
      - name: observed_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: checkin_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: checkout_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: min_total_price
        tests:
          - not_null

  - name: ml_features_flight_pricing
    columns:
      - name: route_id
        tests:
          - not_null
      - name: observed_date
        tests:
          - not_null
      - name: departure_date
        tests:
          - not_null
      - name: min_total_price
        tests:
          - not_null
