version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: is_origin_public_holiday
        tests:
          - not_null
      - name: is_destination_public_holiday
        tests:
          - not_null
      - name: school_break_flag
        tests:
          - not_null
      - name: days_to_nearest_holiday
        tests:
          - not_null

  - name: dim_route
    columns:
      - name: route_key
        tests:
          - not_null
          - unique
      - name: route_id
        tests:
          - not_null
          - unique

  - name: dim_hotel
    columns:
      - name: hotel_key
        tests:
          - not_null
          - unique

  - name: fct_flight_price_observations
    columns:
      - name: flight_observation_key
        tests:
          - not_null
          - unique
      - name: route_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_route')
              field: route_key
      - name: observed_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: departure_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: min_total_price
        tests:
          - not_null

  - name: fct_hotel_price_observations
    columns:
      - name: hotel_observation_key
        tests:
          - not_null
          - unique
      - name: hotel_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_hotel')
              field: hotel_key
      - name: observed_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: checkin_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: checkout_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: min_total_price
        tests:
          - not_null

  - name: ml_features_flight_pricing
    columns:
      - name: flight_observation_key
        tests:
          - not_null
          - unique
      - name: route_id
        tests:
          - not_null
      - name: observed_date
        tests:
          - not_null
      - name: departure_date
        tests:
          - not_null
      - name: min_total_price
        tests:
          - not_null
      - name: day_of_year_sin
        tests:
          - not_null
      - name: day_of_year_cos
        tests:
          - not_null

  - name: ops_ingestion_completeness
    columns:
      - name: provider
        tests:
          - not_null
      - name: ingested_date
        tests:
          - not_null
      - name: route_coverage_pct
        tests:
          - not_null
